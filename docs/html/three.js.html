<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create an abstract anamorphic-style floating geometric object
const group = new THREE.Group();
scene.add(group);

const geometry = new THREE.IcosahedronGeometry(1.5, 2);
const material = new THREE.MeshPhongMaterial({
    color: 0x00aaff,
    wireframe: true,
    transparent: true,
    opacity: 0.8,
    shininess: 100
});

const sphere = new THREE.Mesh(geometry, material);
group.add(sphere);

// Add inner core
const coreGeometry = new THREE.IcosahedronGeometry(0.8, 1);
const coreMaterial = new THREE.MeshStandardMaterial({
    color: 0xaa00ff,
    emissive: 0x4400aa,
    roughness: 0.2,
    metalness: 0.8
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
group.add(core);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x00aaff, 1);
pointLight1.position.set(5, 5, 5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xaa00ff, 1);
pointLight2.position.set(-5, -5, 5);
scene.add(pointLight2);

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    group.rotation.x += 0.005;
    group.rotation.y += 0.01;
    
    sphere.scale.setScalar(1 + Math.sin(Date.now() * 0.002) * 0.1);
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
