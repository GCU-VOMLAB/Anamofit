<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anamofit - Adaptive AI Production for Anamorphic Media Walls</title>
<meta name="description" content="Get in touch with the Anamofit team for partnerships, media-wall projects, and demos."/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/site.css"/>
<script>
tailwind.config = { darkMode:"class", theme:{ extend:{
  colors:{ "cyber-cyan":"#00E0FF","primary":"#93ccff","primary-container":"#00aaff","tertiary":"#ecb2ff","tertiary-container":"#d97bff","on-surface":"#e5e2e1","on-surface-variant":"#bec7d3","void-surface":"#121218","deep-navy":"#050516","text-silver":"#E0E0E0" },
  fontFamily:{ display:["Space Grotesk","sans-serif"], head:["Space Grotesk","sans-serif"], body:["Hanken Grotesk","sans-serif"], mono:["JetBrains Mono","monospace"] },
}}}
</script>
</head>
<body class="min-h-screen flex flex-col">
<canvas id="stars" aria-hidden="true"></canvas>

<!-- NAV -->
<nav id="nav" class="site-nav">
  <a href="index.html#top" class="brand">ANAMOFIT</a>
  <div class="nav-menu">
    <a class="nav-link" href="index.html#about">About</a>
    <a class="nav-link" href="index.html#reel">Design</a>
    <a class="nav-link" href="index.html#tech">Technology</a>
    <a class="nav-link" href="board.html">Board</a>
    <a class="nav-link active" href="contact.html">Contact</a>
  </div>
</nav>

<main class="flex-grow relative z-10">
  <header class="page-hero">
    <div class="page-hero-inner">
      <div class="page-kicker no-number reveal"><span class="page-name">Contact</span></div>
      <h1 class="page-title reveal d1">Bring the screen into the <span class="gradient-text">design</span>.</h1>
    </div>
  </header>

  <section class="px-6 py-20 md:py-24">
    <div class="max-w-7xl mx-auto flex flex-col gap-10 lg:gap-12">
      <div class="reveal d1 w-full overflow-hidden rounded-2xl border border-white/10 bg-black/25 min-h-[520px] md:min-h-[620px] shadow-[0_34px_110px_rgba(0,0,0,.45)]">
        <iframe id="contact-map" class="block h-full min-h-[520px] w-full md:min-h-[620px]" title="Google map showing Gachon University" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <form id="contact-form" class="reveal glass rounded-2xl p-8 md:p-10 flex w-full flex-col gap-6" novalidate>
          <div class="grid sm:grid-cols-2 gap-6">
            <label class="flex flex-col gap-2">
              <span class="mono text-on-surface-variant/70" style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Name</span>
              <input name="name" type="text" required class="bg-black/30 border border-white/10 rounded-lg px-5 py-4 text-white outline-none focus:border-cyber-cyan/60 transition"/>
            </label>
            <label class="flex flex-col gap-2">
              <span class="mono text-on-surface-variant/70" style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Email</span>
              <input name="email" type="email" required class="bg-black/30 border border-white/10 rounded-lg px-5 py-4 text-white outline-none focus:border-cyber-cyan/60 transition"/>
            </label>
          </div>
          <label class="flex flex-col gap-2">
            <span class="mono text-on-surface-variant/70" style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Organization <span class="opacity-50">(optional)</span></span>
            <input name="org" type="text" class="bg-black/30 border border-white/10 rounded-lg px-5 py-4 text-white outline-none focus:border-cyber-cyan/60 transition"/>
          </label>
          <label class="flex flex-col gap-2">
            <span class="mono text-on-surface-variant/70" style="font-size:11px;text-transform:uppercase;letter-spacing:.12em">Message</span>
            <textarea name="message" rows="7" required class="bg-black/30 border border-white/10 rounded-lg px-5 py-4 text-white outline-none focus:border-cyber-cyan/60 transition resize-y"></textarea>
          </label>
          <button type="submit" class="text-deep-navy font-semibold px-8 py-4 rounded-full hover:shadow-[0_0_26px_rgba(0,224,255,0.4)] transition-all flex items-center justify-center gap-2 mono" style="font-size:14px;text-transform:uppercase;letter-spacing:.1em;background:linear-gradient(90deg,#00E0FF,#00aaff)">
            <span class="material-symbols-outlined text-lg">send</span> Send message
          </button>
          <p id="form-note" class="text-on-surface-variant/50 text-sm text-center" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer class="relative z-10 border-t border-white/5 bg-[#070708] px-6 py-12">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
    <div class="head text-2xl font-bold text-text-silver">ANAMOFIT</div>
    <div class="flex flex-wrap gap-6 justify-center text-on-surface-variant/70 mono" style="font-size:12px;text-transform:uppercase;letter-spacing:.12em">
      <a href="index.html#about" class="hover:text-cyber-cyan transition-colors">About</a><a href="index.html#reel" class="hover:text-cyber-cyan transition-colors">Design</a><a href="index.html#tech" class="hover:text-cyber-cyan transition-colors">Technology</a><a href="board.html" class="hover:text-cyber-cyan transition-colors">Board</a><a href="contact.html" class="hover:text-cyber-cyan transition-colors">Contact</a>
    </div>
    <div class="text-on-surface-variant/40 text-center md:text-right mono" style="font-size:11px;letter-spacing:.1em">&copy; 2026 ANAMOFIT.</div>
  </div>
</footer>

<script>
(function(){
  "use strict";
  /* ---- Contact form ----
     No-backend default: opens the visitor's email app addressed to you.
     To collect submissions on the site instead, create a free Formspree form
     (https://formspree.io) and set USE_FORMSPREE = your endpoint URL below. */
  var USE_FORMSPREE = "";            // e.g. "https://formspree.io/f/abcdwxyz"
  var TO = "dlawhks@naver.com";
  var MAP_ADDRESS = "Gachon University, Seongnam, Republic of Korea";

  var map = document.getElementById('contact-map');
  if(map){
    map.src = 'https://www.google.com/maps?q=' + encodeURIComponent(MAP_ADDRESS) + '&output=embed';
  }

  var form = document.getElementById('contact-form');
  var note = document.getElementById('form-note');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var f = form;
    if(!f.name.value.trim() || !f.email.value.trim() || !f.message.value.trim()){
      note.textContent = 'Please fill in your name, email, and message.'; note.style.color='#ffb4ab'; return;
    }
    if(USE_FORMSPREE){
      note.textContent='Sending...'; note.style.color='';
      fetch(USE_FORMSPREE,{ method:'POST', headers:{'Accept':'application/json'}, body:new FormData(f) })
        .then(function(r){ if(r.ok){ form.reset(); note.textContent='Thanks, your message has been sent.'; note.style.color='#93ccff'; } else { throw 0; } })
        .catch(function(){ note.textContent='Could not send. Please email '+TO+' directly.'; note.style.color='#ffb4ab'; });
      return;
    }
    /*
    if(USE_FORMSPREE){
      note.textContent='Sending??; note.style.color='';
      fetch(USE_FORMSPREE,{ method:'POST', headers:{'Accept':'application/json'}, body:new FormData(f) })
        .then(function(r){ if(r.ok){ form.reset(); note.textContent='Thanks ??your message has been sent.'; note.style.color='#93ccff'; } else { throw 0; } })
        .catch(function(){ note.textContent='Could not send. Please email '+TO+' directly.'; note.style.color='#ffb4ab'; });
      return;
    }
    // mailto fallback
    var subject = 'Anamofit inquiry ??'+f.name.value.trim();
    var body = 'Name: '+f.name.value.trim()+'\nEmail: '+f.email.value.trim()+'\nOrganization: '+(f.org.value.trim()||'-')+'\n\n'+f.message.value.trim();
    window.location.href = 'mailto:'+TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    note.textContent='Opening your email app??; note.style.color='#93ccff';
    */
    var subject = 'Anamofit inquiry - '+f.name.value.trim();
    var body = 'Name: '+f.name.value.trim()+'\nEmail: '+f.email.value.trim()+'\nOrganization: '+(f.org.value.trim()||'-')+'\n\n'+f.message.value.trim();
    window.location.href = 'mailto:'+TO+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    note.textContent='Opening your email app...'; note.style.color='#93ccff';
  });

  /* reveal */
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }); },{threshold:0.1});
  document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

  /* nav condense */
  var nav=document.getElementById('nav');
  window.addEventListener('scroll', function(){ nav.classList.toggle('compact', window.scrollY>40); }, {passive:true});

})();
</script>
<script src="assets/stars.js?v=2"></script>
<script src="assets/cursor.js?v=3"></script>
</body>
</html>
